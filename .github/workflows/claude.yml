name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tag mode already grants Glob/Grep/LS/Read, the comment tool and the
          # git add/commit/push trio, and --permission-mode acceptEdits covers
          # file edits. What it does NOT grant is running anything, so a task
          # that says "run the validator and report the real result" cannot be
          # done: every attempt is denied and the denials burn the turn budget.
          # These flags add to the built-in list, they do not replace it.
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(git status),Bash(git status:*),Bash(git diff),Bash(git diff:*),Bash(git log:*),Bash(python3 app/tools/validate_content.py),Bash(python3 app/tools/build_grammar.py),Bash(python3 app/tools/build_vocabulary.py),Bash(python3 app/tools/build_frequency.py),Bash(python3 app/tools/build_cefr.py),Bash(python3 app/tools/build_artifact.py)"