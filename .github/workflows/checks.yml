# The gates, on every pull request.
#
# They used to live only in deploy-pages.yml, which runs on a push to main. So
# they ran after the merge, on the thing that publishes: a bad change was
# caught by main going red and nothing deploying, rather than by the review
# that was supposed to catch it. Worse, that workflow's `paths` filter did not
# list app/tools/**, so a change to an annotation or to a builder — exactly the
# change these gates exist for — skipped CI entirely.
#
# This runs the same gates where they belong, before the merge, on any change
# that could move the content or the engine. deploy-pages.yml keeps its own
# copies: it is what publishes, and the licensing gate runs immediately before
# the artifact is uploaded rather than trusting an earlier job.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      # app/data/*.json is generated from the sources and annotations next to
      # it, and committed so the app can be built without running Python.
      # Committed output drifts: an annotation changes, the rebuild is
      # forgotten, and the app ships the previous data while every check here
      # passes on it. Rebuilding and diffing closes that, and it is also the
      # only thing that runs the builders' own guards — the ones that reject a
      # word-order mark that does not occur in its sentence, an annotation
      # matching no example, an unknown word class, a one-slot formula. Those
      # had never executed anywhere but on a developer's machine.
      - name: Rebuild the data and check nothing drifted
        run: |
          python3 app/tools/build_frequency.py
          python3 app/tools/build_vocabulary.py
          python3 app/tools/build_grammar.py
          if ! git diff --quiet -- app/data; then
            echo "::error::app/data does not match what the sources build."
            echo "Run the three builders in app/tools and commit the result."
            git diff --stat -- app/data
            exit 1
          fi

      # The licensing gate and the content gate.
      - name: Validate content
        run: python3 app/tools/validate_content.py

      # The validator is the last thing between a bad card and the published
      # app, and until now nothing checked the gate itself. These are its own
      # rules, on fixtures.
      - name: Check the validator still enforces its rules
        run: python3 -m unittest discover -s app/tools -p "test_*.py"

      # The engine and server tests. The mobile workspace's own test is the
      # browser smoke run, which skips here because it needs an export.
      - name: Check the engine still passes its own tests
        run: npm test --workspaces --if-present
        env:
          CI: "1"
