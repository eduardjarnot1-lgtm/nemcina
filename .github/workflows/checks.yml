# The gates, on every pull request.
#
# They used to live only in deploy-pages.yml, which runs on a push to main. So
# they ran after the merge, on the thing that publishes: a bad change was
# caught by main going red and nothing deploying, rather than by the review
# that was supposed to catch it. Worse, that workflow's `paths` filter did not
# list app/tools/**, so a change to an annotation or to a builder — exactly the
# change these gates exist for — skipped CI entirely.
#
# The steps themselves are not written here. They are scripts/gates.sh, which
# is also what you run before a push, so "I ran the checks" and "the checks
# ran" are the same list. Writing them out twice is what let a builder that
# exits non-zero with no arguments into the CI list while the local rehearsal
# never ran it.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Gates
        run: ./scripts/gates.sh
        env:
          CI: "1"
