# The one published address: https://eduardjarnot1-lgtm.github.io/nemcina/
#
# It serves the mobile app — apps/mobile, the real product — not the web
# prototype in app/, which is frozen. Every push to main that touches the app,
# the engine or the corpus rebuilds and redeploys it, so the link is always the
# current state of main and nobody has to publish anything by hand.
#
# Two things stand before the deploy, and both are the point rather than
# ceremony:
#
#   scripts/gates.sh     the same gates a pull request runs, run again here
#                        because this is the job that publishes. Among them
#                        validate_content.py, which fails on any card carrying
#                        a third-party translation source: the corpus was
#                        rebuilt from lists written for this project, and this
#                        is what stops borrowed material being served from a
#                        public address again. The gates are a script rather
#                        than steps in this file so that what runs here, what
#                        runs on a pull request and what a developer runs
#                        before pushing are one list.
#
#   assert-api-url.mjs   (inside build:pages) refuses a bundle with a loopback
#                        API URL baked in, which Metro's transform cache has
#                        produced once before.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "app/data/**"
      - "app/tools/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      # The same gates the pull request ran, immediately before the upload:
      # this is the job that publishes, and the licensing gate belongs here
      # rather than trusting an earlier one. One script, so it cannot drift
      # from what a pull request or a developer runs.
      - name: Gates
        run: ./scripts/gates.sh
        env:
          CI: "1"

      # EXPO_BASE_URL is set by the script: Pages serves from /nemcina/, so the
      # prefix is baked in and the router writes links that survive a reload.
      - name: Build the app for Pages
        run: npm run build:pages -w @nemcina/mobile
        env:
          EXPO_OFFLINE: "1"
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
