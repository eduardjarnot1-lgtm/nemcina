# The one published address: https://eduardjarnot1-lgtm.github.io/nemcina/
#
# It serves the mobile app — apps/mobile, the real product — not the web
# prototype in app/, which is frozen. Every push to main that touches the app,
# the engine or the corpus rebuilds and redeploys it, so the link is always the
# current state of main and nobody has to publish anything by hand.
#
# Two gates stand before the deploy, and both are the point rather than
# ceremony:
#
#   validate_content.py  fails on any card carrying a third-party translation
#                        source. The corpus was rebuilt from lists written for
#                        this project; this is what stops borrowed material
#                        being served from a public address again.
#
#   assert-api-url.mjs   (inside build:pages) refuses a bundle with a loopback
#                        API URL baked in, which Metro's transform cache has
#                        produced once before.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "app/data/**"
      - "app/tools/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      # app/data/*.json is generated from the sources and annotations next to
      # it, and is committed so the app can be built without running Python.
      # Committed output drifts: an annotation changes, the rebuild is
      # forgotten, and the app ships the previous data while every check here
      # passes on it. Rebuilding and diffing closes that, and it is also the
      # only thing that runs the builders' own guards in CI — the ones that
      # reject a word-order mark that does not occur in its sentence, an
      # annotation matching no example, and an unknown word class. Those had
      # never executed on a pull request.
      # frequency.json is not in here. It is built from the hermitdave/
      # FrequencyWords list, which the builder takes as an argument and which
      # is not in the repository — so it cannot be regenerated on a runner. It
      # is an input that changes when that list is republished, not an output
      # of this repository's own sources.
      - name: Rebuild the data and check nothing drifted
        run: |
          python3 app/tools/build_vocabulary.py
          python3 app/tools/build_grammar.py
          if ! git diff --quiet -- app/data/vocabulary.json app/data/grammar.json; then
            echo "::error::app/data does not match what the sources build."
            echo "Run build_vocabulary.py and build_grammar.py in app/tools and commit the result."
            git diff --stat -- app/data
            exit 1
          fi

      # The licensing gate. Nothing is published if the corpus is not ours.
      - name: Validate content
        run: python3 app/tools/validate_content.py

      # The validator is the licensing gate and the content gate, and until now
      # nothing checked the gate itself. These are its own rules, on fixtures.
      - name: Check the validator still enforces its rules
        run: python3 -m unittest discover -s app/tools -p "test_*.py" -v

      # The 394 engine and server tests. The mobile workspace's own test is the
      # browser smoke run, which skips here because it needs an export that
      # does not exist yet at this point — it is run before a push, not in CI.
      - name: Check the engine still passes its own tests
        run: npm test --workspaces --if-present
        env:
          CI: "1"

      # EXPO_BASE_URL is set by the script: Pages serves from /nemcina/, so the
      # prefix is baked in and the router writes links that survive a reload.
      - name: Build the app for Pages
        run: npm run build:pages -w @nemcina/mobile
        env:
          EXPO_OFFLINE: "1"
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
